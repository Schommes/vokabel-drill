<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Vokabeltrainer"><meta name="theme-color" content="#2a99e6">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><title>Vokabeltrainer</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f9ff;color:#17324d}*{box-sizing:border-box}
body{margin:0;max-width:850px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
h1{margin:4px 0 14px;font-size:28px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:white;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #bfd5e544}
button,input,select,textarea{font:inherit}button{border:0;touch-action:manipulation;cursor:pointer;border-radius:15px;padding:13px 15px;font-weight:750;background:#e7f2fb;color:#17324d}
.primary{background:#2a99e6;color:white}.green{background:#39b54a;color:white}.danger{background:#ffe7e7;color:#a22}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
input,select,textarea{width:100%;border:2px solid #dbe8f2;border-radius:13px;padding:12px;background:white}label{font-size:13px;font-weight:700}
.list{display:grid;gap:9px}.item{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;padding:13px;background:#fff8d9;border-radius:15px}
.tabs{display:flex;gap:7px;overflow:auto}.tabs button{white-space:nowrap}.hidden{display:none!important}.big{font-size:31px;text-align:center;font-weight:800;padding:25px}
.progress{height:10px;background:#dcebf5;border-radius:8px;overflow:hidden}.bar{height:100%;background:#39b54a}
.ok{background:#dcf6df}.bad{background:#ffe2e2}.muted{color:#698096;font-size:13px}.center{text-align:center}
.fire{position:fixed;inset:0;pointer-events:none;overflow:hidden}.conf{position:absolute;font-size:28px;animation:fall 2.2s linear forwards}@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(720deg)}}
</style></head><body>
<div class="top"><h1>📚 Vokabeltrainer</h1><button onclick="show('settings')">⚙️</button></div>
<div id="home">
<div class="card"><b>Profil</b><div class="row" id="profiles"></div><button onclick="addProfile()">＋ Profil</button></div>
<div class="card"><div class="top"><b>Meine Vokabellisten</b><button class="primary" onclick="newList()">＋ Neue Liste</button></div><div id="lists" class="list"></div></div>
<div class="card"><button onclick="showStats()">📊 Lernstatistik</button></div></div>

<div id="editor" class="hidden">
<button onclick="show('home')">‹ Zurück</button><div class="card"><label>Titel</label><input id="title"><label>Fremdsprache</label><select id="lang"><option value="en-US">Englisch</option><option value="fr-FR">Französisch</option><option value="es-ES">Spanisch</option><option value="it-IT">Italienisch</option><option value="pt-PT">Portugiesisch</option><option value="nl-NL">Niederländisch</option></select>
<div class="row"><label><input type="checkbox" id="case" style="width:auto"> Groß-/Kleinschreibung beachten</label><label><input type="checkbox" id="accent" style="width:auto" checked> Akzente beachten</label></div></div>
<div class="card"><b>Vokabel hinzufügen</b><label>Fremdsprache</label><input id="foreign" autocapitalize="none" autocorrect="off" spellcheck="false"><label>Deutsch – mehrere Lösungen mit | trennen</label><input id="german" autocapitalize="none"><div class="row"><button onclick="addWord()">＋ Hinzufügen</button><button id="dictateBtn" type="button" onclick="dictateGerman()">🎙 Deutsch diktieren</button></div><div id="dictateStatus" class="muted" aria-live="polite"></div></div>
<div class="card"><b>Masseneingabe</b><div class="muted">Eine Zeile je Paar, z. B. kitchen = Küche | die Küche</div><textarea id="bulk" rows="5" autocapitalize="none" autocorrect="off" spellcheck="false"></textarea><button onclick="bulkAdd()">Übernehmen</button>
<label style="margin-top:12px;display:block">Foto auswählen (Texterkennung hängt von Browser/iOS ab)</label><input type="file" accept="image/*" capture="environment" onchange="photoHint()"></div>
<div class="card"><b>Vokabeln</b><div id="words" class="list"></div></div><button class="green" onclick="saveList()">Liste speichern</button></div>

<div id="modes" class="hidden"><button onclick="show('home')">‹ Zurück</button><h2 id="modeTitle"></h2>
<div class="card list"><button class="primary" onclick="start('speak')">🎙 Fremdsprache → Deutsch sprechen</button><button class="primary" onclick="start('write')">⌨️ Deutsch → Fremdsprache schreiben</button><button onclick="editCurrent()">✏️ Vokabeln bearbeiten</button></div></div>

<div id="quiz" class="hidden"><button onclick="endQuiz()">‹ Beenden</button><div class="progress"><div id="bar" class="bar"></div></div><div id="qcount" class="muted center"></div><div class="card big" id="prompt"></div>
<div id="speakUI" class="card center hidden"><button class="primary" style="font-size:28px" onclick="listen()">🎙 Sprechen</button><div id="heard" class="big"></div></div>
<div id="writeUI" class="card hidden"><input id="answer" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkWrite()"><button class="primary" onclick="checkWrite()">Prüfen</button></div>
<div id="feedback" class="card center hidden"></div></div>

<div id="finish" class="hidden center"><div id="fire" class="fire"></div><div class="card"><div class="big">🏆 Super!</div><h2>Alle Vokabeln geschafft!</h2><p id="finishInfo"></p><button class="primary" onclick="start(lastMode)">Noch einmal</button> <button onclick="show('modes')">Zur Liste</button></div></div>

<div id="stats" class="hidden"><button onclick="show('home')">‹ Zurück</button><div class="card"><h2>📊 Lernstatistik</h2><div id="statbody"></div></div></div>
<div id="settings" class="hidden"><button onclick="show('home')">‹ Zurück</button><div class="card"><h2>Einstellungen</h2><label><input type="checkbox" id="sound" style="width:auto" checked onchange="save()"> Töne</label><br><label><input type="checkbox" id="vibrate" style="width:auto" checked onchange="save()"> Vibration (falls unterstützt)</label></div>
<div class="card"><button onclick="exportData()">⬆️ Backup exportieren</button><label>Backup importieren</label><input type="file" accept=".json,application/json" onchange="importData(this)"></div></div>
<script>
const K='vocabtrainer-v1';let D=JSON.parse(localStorage.getItem(K)||'null')||{profiles:[{id:'p1',name:'Kind',avatar:'🦊'}],active:'p1',lists:[],sessions:[],sound:true,vibrate:true};let editId=null,currentId=null,queue=[],current=null,lastMode='speak',started=0;
function save(){D.sound=sound?.checked??D.sound;D.vibrate=vibrate?.checked??D.vibrate;localStorage.setItem(K,JSON.stringify(D))}
function show(id){['home','editor','modes','quiz','finish','stats','settings'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));if(id==='home')renderHome();if(id==='settings'){sound.checked=D.sound;vibrate.checked=D.vibrate}}
function el(id){return document.getElementById(id)}
function renderHome(){
 el('profiles').innerHTML=D.profiles.map(p=>`<button type="button" onclick="selectProfile('${p.id}')" class="${D.active===p.id?'primary':''}">${p.avatar} ${esc(p.name)}</button>`).join('');
 el('lists').innerHTML=D.lists.length?D.lists.map(l=>`<div class="item"><div style="flex:1"><b>${esc(l.title)}</b><br><span class="muted">${l.words.length} Vokabeln</span></div><div class="row"><button type="button" class="primary" onclick="openList('${l.id}')">▶ Üben</button><button type="button" onclick="editList('${l.id}')">✏️ Bearbeiten</button><button type="button" class="danger" onclick="delList('${l.id}')">🗑 Löschen</button></div></div>`).join(''):'<span class="muted">Noch keine Liste.</span>';
}
function selectProfile(id){D.active=id;save();renderHome()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function addProfile(){let n=prompt('Name des Profils:');if(n){let av=['🦊','🐼','🦁','🐸','🐧'][D.profiles.length%5];let id='p'+Date.now();D.profiles.push({id,name:n,avatar:av});D.active=id;save();renderHome()}}
function newList(){editId=null;el('title').value='';el('lang').value='en-US';document.getElementById('case').checked=false;accent.checked=true;window.tmp=[];renderWords();show('editor')}
function editList(id){let l=D.lists.find(x=>x.id===id);editId=id;el('title').value=l.title;el('lang').value=l.lang;document.getElementById('case').checked=l.case;accent.checked=l.accent;window.tmp=JSON.parse(JSON.stringify(l.words));renderWords();show('editor')}
function addWord(){if(!el('foreign').value.trim()||!el('german').value.trim())return;tmp.push({f:el('foreign').value.trim(),g:el('german').value.split('|').map(x=>x.trim()).filter(Boolean)});el('foreign').value=el('german').value='';renderWords()}
function bulkAdd(){el('bulk').value.split(/\n/).forEach(line=>{let m=line.split(/\s*(?:=|\t|;)\s*/);if(m.length>=2)tmp.push({f:m[0].trim(),g:m.slice(1).join(';').split('|').map(x=>x.trim()).filter(Boolean)})});el('bulk').value='';renderWords()}
function renderWords(){el('words').innerHTML=(tmp||[]).map((w,i)=>`<div class=item><span><b>${esc(w.f)}</b><br>${w.g.map(esc).join(' / ')}</span><button class=danger onclick="tmp.splice(${i},1);renderWords()">×</button></div>`).join('')}
function saveList(){if(!el('title').value.trim()||!tmp.length)return alert('Bitte Titel und mindestens eine Vokabel eingeben.');let l={id:editId||'l'+Date.now(),title:el('title').value.trim(),lang:el('lang').value,case:document.getElementById('case').checked,accent:accent.checked,words:tmp};if(editId)D.lists[D.lists.findIndex(x=>x.id===editId)]=l;else D.lists.push(l);save();show('home')}
function delList(id){if(confirm('Diese Vokabelliste wirklich löschen?')){D.lists=D.lists.filter(x=>x.id!==id);save();renderHome()}}
function openList(id){currentId=id;el('modeTitle').textContent=D.lists.find(x=>x.id===id).title;show('modes')}function editCurrent(){editList(currentId)}
function norm(s,l){s=s.trim();if(!l.case)s=s.toLowerCase();if(!l.accent)s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');return s.replace(/[.!?]+$/,'').trim()}
function start(mode){lastMode=mode;let l=D.lists.find(x=>x.id===currentId);queue=[...l.words].sort(()=>Math.random()-.5).map(w=>({...w}));started=Date.now();show('quiz');el('speakUI').classList.toggle('hidden',mode!=='speak');el('writeUI').classList.toggle('hidden',mode!=='write');next()}
function next(){if(!queue.length)return complete();current=queue.shift();let l=D.lists.find(x=>x.id===currentId);document.getElementById('prompt').textContent=lastMode==='speak'?current.f:current.g[0];document.getElementById('feedback').classList.add('hidden');document.getElementById('heard').textContent='';document.getElementById('answer').value='';document.getElementById('qcount').textContent=`Noch ${queue.length+1} Vokabel${queue.length?'n':''}`;document.getElementById('bar').style.width=((l.words.length-queue.length-1)/l.words.length*100)+'%';if(lastMode==='write')setTimeout(()=>document.getElementById('answer').focus(),100)}
function verdict(ok,msg){feedback.className='card center '+(ok?'ok':'bad');feedback.textContent=msg;feedback.classList.remove('hidden');tone(ok);if(!ok)queue.push(current);setTimeout(next,700)}
function checkWrite(){let l=D.lists.find(x=>x.id===currentId);verdict(norm(answer.value,l)===norm(current.f,l),norm(answer.value,l)===norm(current.f,l)?'✓ Richtig!':'✗ Noch einmal')}
let activeRecognition=null,speechTimer=null;
function speechErrorText(c){if(c==='not-allowed'||c==='service-not-allowed')return 'Mikrofonzugriff wurde nicht erlaubt.';if(c==='no-speech')return 'Nichts verstanden – bitte erneut versuchen.';if(c==='audio-capture')return 'Kein Mikrofon verfügbar.';return 'Spracherkennung beendet – bitte erneut versuchen.'}
function clearSpeech(){if(speechTimer){clearTimeout(speechTimer);speechTimer=null}if(activeRecognition){try{activeRecognition.abort()}catch(e){}activeRecognition=null}}
function listen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Spracherkennung wird von diesem Browser nicht unterstützt.');
 clearSpeech();const h=el('heard');h.textContent='🎙 Ich höre zu …';const r=new SR();activeRecognition=r;r.lang='de-DE';r.interimResults=false;r.maxAlternatives=1;let got=false;
 r.onresult=e=>{got=true;const t=e.results[0][0].transcript;h.textContent='Erkannt: '+t;const l=D.lists.find(x=>x.id===currentId),ok=current.g.some(g=>norm(g,l)===norm(t,l));setTimeout(()=>verdict(ok,ok?'✓ Richtig!':'✗ Noch einmal'),300)};
 r.onerror=e=>h.textContent=speechErrorText(e.error);
 r.onend=()=>{if(speechTimer){clearTimeout(speechTimer);speechTimer=null}activeRecognition=null;if(!got&&h.textContent==='🎙 Ich höre zu …')h.textContent='Nichts verstanden – bitte erneut versuchen.'};
 speechTimer=setTimeout(()=>{if(activeRecognition===r){h.textContent='Zeit abgelaufen – bitte erneut versuchen.';try{r.abort()}catch(e){}}},8000);
 try{r.start()}catch(e){h.textContent='Spracherkennung konnte nicht gestartet werden.';clearSpeech()}
}
function tone(ok){if(!D.sound)return;try{let a=new (AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?660:220;o.connect(g);g.connect(a.destination);g.gain.value=.04;o.start();o.stop(a.currentTime+.12)}catch(e){}}
function complete(){let sec=Math.round((Date.now()-started)/1000);D.sessions.push({p:D.active,l:currentId,mode:lastMode,sec,date:new Date().toISOString()});save();if(D.vibrate&&navigator.vibrate)navigator.vibrate([80,40,80]);show('finish');el('finishInfo').textContent=`Zeit: ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')} Minuten`;el('fire').innerHTML='';for(let i=0;i<55;i++){let s=document.createElement('span');s.className='conf';s.textContent=['✨','⭐','🎉','●'][i%4];s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*.5+'s';el('fire').appendChild(s)}setTimeout(()=>el('fire').innerHTML='',2600)}
function endQuiz(){show('modes')}
function showStats(){show('stats');let ss=D.sessions.filter(s=>s.p===D.active),tot=ss.reduce((a,s)=>a+s.sec,0),today=new Date().toISOString().slice(0,10),td=ss.filter(s=>s.date.slice(0,10)===today).reduce((a,s)=>a+s.sec,0);el('statbody').innerHTML=`<div class=big>${Math.round(td/60)} Min. heute</div><p>Gesamt: <b>${Math.round(tot/60)} Minuten</b></p><p>Abgeschlossene Übungen: <b>${ss.length}</b></p>`}
function exportData(){let b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Vokabeltrainer-Backup.json';a.click()}
function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();show('home')}catch(e){alert('Backup konnte nicht gelesen werden.')}};r.readAsText(f)}
function dictateGerman(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Spracherkennung wird von diesem Browser nicht unterstützt.');
 clearSpeech();const btn=el('dictateBtn'),st=el('dictateStatus');btn.disabled=true;st.textContent='🎙 Ich höre zu …';const r=new SR();activeRecognition=r;r.lang='de-DE';r.interimResults=false;r.maxAlternatives=1;let got=false;
 r.onresult=e=>{
  got=true;
  let t=e.results[0][0].transcript.trim();
  const lowerFirstWords=new Set(['Die','Der','Das','Den','Dem','Des','Ein','Eine','Einen','Einem','Einer','Eines','Mein','Meine','Meinen','Meinem','Meiner','Meines','Dein','Deine','Deinen','Deinem','Deiner','Deines','Sein','Seine','Ihr','Ihre','Unser','Unsere','Euer','Eure','Kein','Keine','Dieser','Diese','Dieses','Jener','Jene','Jenes']);
  const m=t.match(/^([^\s]+)(.*)$/);
  if(m&&lowerFirstWords.has(m[1]))t=m[1].charAt(0).toLowerCase()+m[1].slice(1)+m[2];
  const old=el('german').value.trim();
  el('german').value=old?old+' | '+t:t;
  st.textContent='Erkannt: '+t;
};
 r.onerror=e=>st.textContent=speechErrorText(e.error);
 r.onend=()=>{if(speechTimer){clearTimeout(speechTimer);speechTimer=null}activeRecognition=null;btn.disabled=false;if(!got&&st.textContent==='🎙 Ich höre zu …')st.textContent='Nichts verstanden – bitte erneut versuchen.'};
 speechTimer=setTimeout(()=>{if(activeRecognition===r){st.textContent='Zeit abgelaufen – bitte erneut versuchen.';try{r.abort()}catch(e){}}},8000);
 try{r.start()}catch(e){st.textContent='Spracherkennung konnte nicht gestartet werden.';btn.disabled=false;clearSpeech()}
}
function photoHint(){alert('Foto wurde ausgewählt. Vollautomatische OCR ist in dieser rein lokalen GitHub-Pages-Version noch nicht zuverlässig genug. Nutze vorerst Masseneingabe oder die iOS-Texterkennung zum Kopieren des Textes; die Importmaske bleibt für die spätere OCR-Erweiterung vorbereitet.')}
show('home');
</script></body></html>
